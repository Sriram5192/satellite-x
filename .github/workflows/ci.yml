name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements.txt
      - run: PYTHONPATH=src python -m compileall -q src apps audit
      - run: node --check mobile/app.js && node --check mobile/service-worker.js
      - run: PYTHONPATH=src pytest -q
      - run: PYTHONPATH=src python -m satellite_x export-schemas --directory schemas-ci
      - uses: actions/upload-artifact@v4
        with:
          name: schemas
          path: schemas-ci/
